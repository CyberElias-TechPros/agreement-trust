name: Deploy backend

# Deploys the taskcontract-api worker (the backend behind the Agreement Trust
# frontend) on push to main. Lives in the Ceang@techpros.com.ng Cloudflare
# account. Schema: worker/migrations/0001_init.sql -- already applied to the
# remote `taskcontract` D1, so this workflow intentionally deploys code only.
# Requires repo secrets CF_API_TOKEN + CF_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN / CF_ACCOUNT_ID repo secrets (Ceang account)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test.mjs
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Verify health
        run: |
          body="$(curl -fsS https://taskcontract-api.ceang.workers.dev/api/v1/health)"
          echo "$body"
          echo "$body" | grep -q '"database":"ok"' || {
            echo "::error::taskcontract-api health check failed"; exit 1; }